[build-system]
requires = ["setuptools>=77"]   # the SPDX `license` string below
build-backend = "setuptools.build_meta"

[project]
name = "quant-dev"
version = "0.1.0"
description = "Historical price & return analysis framework, plus TradingView Pine scripts"
readme = "README.md"
requires-python = ">=3.12"   # pandas_ta (the ta extra) publishes nothing for 3.11
authors = [{ name = "Jones Wan" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas",
    "numpy",
    "plotly",
    "yfinance",
    "pyyaml",
]

# src.tools.ta_tools needs this extra: TA-Lib is its primary backend, pandas_ta the
# secondary. `ta` is here only so notebooks/ta_package_evaluation.ipynb re-runs.
# Optional because TA-Lib has needed a C toolchain on some platforms.
[project.optional-dependencies]
dev = ["pytest", "ipywidgets", "nbformat", "httpx2"]
ta = ["pandas_ta", "ta", "TA-Lib"]
# src.tools.price_return.stats needs scipy for chi-squared p-values and the Student-t fit.
stats = ["scipy"]
# src.api (the dashboard's API server) needs FastAPI and uvicorn.
api = ["fastapi", "uvicorn[standard]"]
# src.tools.ml_models' models need LightGBM and PyTorch; the rest of the package needs neither.
# The default Linux torch wheel bundles CUDA (several GB): for CPU only, install torch first with
# pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["lightgbm", "torch", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "slow: the ML models' sanity checks; run by default, left out by -m 'not slow'",
    "exhaustive: the GRU's other input sets on every check; only with -m exhaustive (about 6 min)",
]
addopts = "-m 'not exhaustive'"
